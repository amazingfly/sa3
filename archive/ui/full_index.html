<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SA3 Suite</title>
  <style>
    :root { color-scheme: dark; --bg: #111314; --panel: #191c1d; --panel2: #202526; --text: #f1f4ef; --muted: #aab3ad; --line: #38403d; --accent: #7cd67a; --warn: #f0b35b; --bad: #ef7777; }
    body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 980px; margin: 0 auto; padding: 24px; }
    .tabs { display: flex; gap: 2px; margin-bottom: -1px; position: relative; z-index: 1; margin-top: 18px; }
    .tab { padding: 10px 20px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-bottom: none; border-radius: 8px 8px 0 0; color: var(--muted); font-weight: 600; font-size: 14px; }
    .tab.active { background: var(--panel2); color: var(--accent); border-bottom: 1px solid var(--panel2); }
    .view { display: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; padding: 16px; }
    .view.active { display: block; }
    button { border: 0; border-radius: 6px; padding: 10px 14px; background: var(--accent); color: #071007; font-weight: 700; cursor: pointer; }
    button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <div class="tabs">
    <div class="tab active" data-target="audioView">Audio Gen</div>
    <div class="tab" data-target="galleryView">Gallery</div>
    <div class="tab" data-target="imageView">Image Gen</div>
  </div>
  <div id="audioView" class="view active">
    <!-- Restored audio form here -->
  </div>
  <div id="galleryView" class="view">...</div>
  <div id="imageView" class="view">...</div>
</main>
</body>
</html>
